name: Deploy to Production
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
jobs:
  deploy-production:
    name: Deploy to Production Environment
    # Only run if the PR was merged (not just closed) or triggered manually
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: self-hosted  # Runs on your Ubuntu iMac server runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main  # Ensure we deploy the merged main branch

      - name: Set variables
        run: |
          echo "PROD_ROOT=/home/andrew/web_server/site" >> $GITHUB_ENV
          echo "WEB_SERVER_ROOT=/home/andrew/web_server" >> $GITHUB_ENV
          echo "BACKUP_DIR=/home/andrew/web_server/backups/prod_backup_$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV
          echo "HOST=mitchellnet.local" >> $GITHUB_ENV
          echo "PROXY_IP=127.0.0.1" >> $GITHUB_ENV

      - name: Create backup directory
        run: |
          mkdir -p /home/andrew/web_server/backups
          echo "Backups will be stored in: /home/andrew/web_server/backups"

      - name: Backup current production content
        run: |
          set -euo pipefail
          echo "=== Backing up existing production to: $BACKUP_DIR ==="
          if [ -d "$PROD_ROOT" ]; then
            cp -r "$PROD_ROOT" "$BACKUP_DIR"
            echo "Backup completed successfully"
          else
            echo "No existing production directory; creating it."
            mkdir -p "$PROD_ROOT"
          fi

      - name: Write deployment metadata
        run: |
          set -euo pipefail
          mkdir -p site
          cat > site/version.json <<EOF
          {
            "env": "production",
            "commit": "$GITHUB_SHA",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "deployed_by": "${{ github.actor }}",
            "pr_number": "${{ github.event.pull_request.number }}",
            "pr_title": "${{ github.event.pull_request.title }}"
          }
          EOF
          echo "Deployment metadata:"
          cat site/version.json

      - name: Test nginx configuration (gate)
        run: |
          set -euo pipefail
          SECRETS_DIR="$WEB_SERVER_ROOT/secrets"
          KEY_FILE="$SECRETS_DIR/bis-gui-key.conf"
          # A missing include file would stop nginx and take every site down.
          # Check existence only; the file is never read or printed.
          if [ ! -f "$KEY_FILE" ]; then
            echo "ERROR: $KEY_FILE is missing. Create it on the server first (see docs/nginx-routing.md)."
            exit 1
          fi
          echo "=== nginx -t on the checked-out config (before anything is deployed) ==="
          # Upstream names must resolve, so the test container joins both Docker networks.
          cid=$(docker create --network web_server_webnet \
            -v "$GITHUB_WORKSPACE/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$GITHUB_WORKSPACE/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$WEB_SERVER_ROOT/nginx/certs/server.crt:/etc/nginx/ssl/server.crt:ro" \
            -v "$WEB_SERVER_ROOT/nginx/certs/server.key:/etc/nginx/ssl/server.key:ro" \
            -v "$SECRETS_DIR:/etc/nginx/secrets:ro" \
            nginx:1.29 nginx -t)
          rc=0
          docker network connect mitchellnet "$cid" || rc=$?
          if [ "$rc" -eq 0 ]; then docker start -a "$cid" || rc=$?; fi
          docker rm -f "$cid" >/dev/null
          if [ "$rc" -ne 0 ]; then
            echo "ERROR: nginx -t failed; nothing was deployed."
            exit 1
          fi

      - name: Deploy content to production
        run: |
          set -euo pipefail
          echo "=== Deploying site -> $PROD_ROOT ==="
          rsync -av --delete site/ "$PROD_ROOT"/
          echo "HTML deployment completed"
          
          echo "=== Deploying nginx configuration ==="
          rsync -av --delete --exclude='certs/' nginx/ "$WEB_SERVER_ROOT/nginx"/
          echo "Nginx config deployment completed"
          
          echo "=== Deploying docker-compose and other configs ==="
          rsync -av docker-compose.yml "$WEB_SERVER_ROOT/"
          echo "Docker-compose deployment completed"
          echo "=== Deploying includes fragments ==="
          rsync -av --delete includes/ "$WEB_SERVER_ROOT/includes"/
          echo "Includes deployment completed"
          echo "All deployments completed successfully"

      - name: Restart nginx-prod container
        run: |
          echo "Restarting nginx-prod container..."
          docker restart nginx-prod || true
          sleep 3
          
      - name: Recreate nginx-proxy container
        run: |
          echo "Recreating nginx-proxy container to pick up new config and cert mounts..."
          cd "$WEB_SERVER_ROOT"
          docker rm -f nginx-proxy || true
          docker compose up -d nginx-proxy
          sleep 3

      - name: Verify production deployment
        run: |
          set -euo pipefail
          HOST="$HOST"
          IP="$PROXY_IP"
          PATHS=("/")

          echo "=== Verifying production deployment ==="
          for p in "${PATHS[@]}"; do
            status=$(curl -skI --resolve "$HOST:443:$IP" "https://${HOST}${p}" | sed -n '1s/.* \([0-9][0-9][0-9]\).*/\1/p')
            echo "  ${p} -> ${status}"
            if [ "$status" != "200" ]; then
              echo "ERROR: Failed to verify ${p}"
              exit 1
            fi
          done

          echo "✅ Production deployment verified successfully"

      - name: Deployment summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 Deployment Complete!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Environment: Production"
          echo "Commit: $GITHUB_SHA"
          echo "PR: #${{ github.event.pull_request.number }}"
          echo "Deployed by: ${{ github.actor }}"
          echo "Backup: $BACKUP_DIR"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
